# Netlify: builds the web version of LexConnect (Expo web) and serves it as a
# single-page app. Set these in Netlify → Site configuration → Environment
# variables (they are baked into the build; the anon key is public by design):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Expo CLI prompts are off in CI.
  CI = "1"

# Every path (e.g. /cases/123, /reset-password) loads the app, which then
# routes on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change, so browsers can cache them for a year.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
